name: Android unit regressions
on:
  push:
    branches: [fix/0.5.28-audit-poster-stability]
    paths: ['android/**', '.github/workflows/android-unit-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # These Robolectric tests exercise Kotlin/UI logic, not JNI playback.
      # The separate hardened build still compiles and verifies FFmpeg ABIs.
      - run: gradle :app:testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-unit-regression-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
