name: Panel security tests
on:
  push:
    paths: ['panel/**', '.github/workflows/test-panel.yml']
  pull_request:
    paths: ['panel/**', '.github/workflows/test-panel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r panel/requirements-dev.txt
      - name: API compatibility and security tests
        working-directory: panel
        run: python -m unittest discover -s tests -v
      - name: Verify container packaging
        run: docker build -t sega-panel-security-test panel
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sega-ui-tests" playwright@1.62.1
          "$RUNNER_TEMP/sega-ui-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test themes, MAC input, reseller activation and portal PIN in browser
        env:
          NODE_PATH: ${{ runner.temp }}/sega-ui-tests/node_modules
        run: node panel/tests_ui/smoke.cjs
