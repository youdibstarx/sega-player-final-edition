name: Build SEGA PLAYER V3 Secure APK
on:
  workflow_dispatch:
  push:
    branches: [main, fix/commercial-batch-one, fix/commercial-batch-two, fix/0.5.16-full-stack-compatible, feature/0.5.17-dashboard-network-m3u]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build hardened APK
        working-directory: android
        env:
          SEGA_BACKEND_URL: ${{ vars.SEGA_IPTV_BACKEND_URL }}
        run: |
          if [ -n "$SEGA_BACKEND_URL" ]; then
            gradle :app:testDebugUnitTest :app:assembleHardened "-PSEGA_IPTV_BACKEND_URL=$SEGA_BACKEND_URL"
          else
            gradle :app:testDebugUnitTest :app:assembleHardened
          fi
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEGA-Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
      - name: Verify independent protected application
        run: |
          APK=android/app/build/outputs/apk/hardened/app-hardened-unsigned.apk
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.segaiptv.player.v3.secure"
          test "$(apkanalyzer manifest version-code "$APK")" = "35"
      - name: Sign only with the persistent owner certificate
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SEGA_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SEGA_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=android/app/build/outputs/apk/hardened/app-hardened-unsigned.apk
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ]; then
            cp "$APK" dist/SEGA_PLAYER_V3_0.5.17_UNSIGNED.apk
            echo "artifact=SEGA-PLAYER-V3-secure-UNSIGNED" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are absent. Artifact is unsigned and cannot be installed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/sega-v3-secure.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias sega-v3-secure --ks-pass env:KEYSTORE_PASSWORD --out dist/SEGA_PLAYER_V3_0.5.17.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/SEGA_PLAYER_V3_0.5.17.apk > dist/signing-certificate.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: d25ec500c54c69192ed12bd160ea87ecfbed146fb8ba728cac2b9a95397263b4' dist/signing-certificate.txt
          echo "artifact=SEGA-PLAYER-V3-secure-APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: dist/
          if-no-files-found: error
      - name: Prepare files for the public update directory
        if: steps.signing.outputs.artifact == 'SEGA-PLAYER-V3-secure-APK'
        run: |
          set -eu
          apk=$(find dist -name '*.apk' -print -quit)
          code=$(apkanalyzer manifest version-code "$apk")
          version=$(apkanalyzer manifest version-name "$apk")
          mkdir -p sega-updates
          cp "$apk" "sega-updates/sega-$code.apk"
          digest=$(sha256sum "$apk" | cut -d' ' -f1)
          jq -n --argjson versionCode "$code" --arg versionName "${version%-secure}" --arg sha256 "$digest" '{versionCode:$versionCode,versionName:$versionName,sha256:$sha256}' > sega-updates/latest.json
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.artifact == 'SEGA-PLAYER-V3-secure-APK'
        with:
          name: SEGA-hosted-update
          path: sega-updates/
      - name: Preserve private R8 mappings
        uses: actions/upload-artifact@v4
        with:
          name: SEGA-PLAYER-V3-private-R8-mappings
          path: android/app/build/outputs/mapping/
          if-no-files-found: error



